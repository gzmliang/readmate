<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ReadMate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 顶部常驻：精致下拉语言选择栏 (8国语言全覆盖) -->
    <div class="lang-nav-bar">
      <div class="lang-nav-brand">
        <span class="app-icon">📖</span>
        <span class="app-name" id="appBrandName">ReadMate</span>
      </div>
      <div class="lang-select-wrap">
        <span class="lang-globe-icon">🌐</span>
        <select id="uiLangSelect" class="lang-dropdown">
          <option value="zh_CN" data-no-i18n="1">🇨🇳 简体中文</option>
          <option value="en">🇺🇸 English</option>
          <option value="ja" data-no-i18n="1">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="es">🇪🇸 Español</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="ru">🇷🇺 Русский</option>
        </select>
      </div>
    </div>

    <!-- 头部 + 朗读操作 -->
    <div class="header">
      <div class="action-bar">
        <button id="readPageBtn" class="btn-read-page">▶ Read Page</button>
        <button id="stopBtn" class="btn-stop" title="Stop reading (Ctrl+Shift+S)">⏹ Stop</button>
        <button id="injectBtn" class="btn-inject" title="Re-detect / inject the extension">🔄</button>
      </div>
      <div id="pageStatus" class="page-status">...</div>
      <div class="shortcut-tip" id="lblShortcutTip">Shortcuts: Ctrl+Shift+P to Read, Ctrl+Shift+S to Stop</div>
      <div class="refresh-tip" id="lblRefreshTip">💡 If newly installed/updated, refresh the webpage to activate</div>
    </div>

    <!-- 朗读与双语模式 -->
    <div class="section">
      <div class="section-title" id="lblSectionVoiceStream">Voice Stream Mode</div>
      <div class="setting-row">
        <label id="lblVoiceMode">Playback Mode</label>
        <select id="readVoiceMode">
          <option value="original" id="optModeOriginal">🔊 Original Only (Pure audio)</option>
          <option value="translated" id="optModeTranslated">🌐 Translated Only (Native broadcast)</option>
          <option value="bilingual" id="optModeBilingual">🔄 Bilingual Alternating (Sentence by sentence)</option>
        </select>
      </div>
      <div class="setting-row">
        <label id="lblEnableBilingual">Bilingual Study Mode</label>
        <label class="switch-label">
          <input type="checkbox" id="enableBilingual">
          <span id="lblChkEnableBilingual">Enable full-page bilingual comparison, bilingual alternating TTS, and bilingual PDF export</span>
        </label>
      </div>
      <div class="setting-row">
        <label id="lblBilingualSubtitles">Subtitles</label>
        <label class="switch-label">
          <input type="checkbox" id="showBilingualSubtitles" checked>
          <span id="lblChkShowSubtitles">Show bilingual lyrics/subtitles on bar</span>
        </label>
      </div>
    </div>

    <!-- 引擎切换 -->
    <div class="section">
      <div class="section-title-wrap" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="section-title" id="lblTtsSection" style="margin:0;">Speech Engine</div>
        <button class="btn-help-link" id="btnHelpTtsPopup" type="button" style="background:none;border:none;color:#38bdf8;cursor:pointer;font-size:12px;text-decoration:underline;">❓ Voice Engines &amp; Self-Hosting Edge-TTS Guide</button>
      </div>
      <div class="engine-switch">
        <label class="engine-option">
          <input type="radio" name="ttsEngine" value="cloud" checked>
          <span id="lblEngineCloud">☁️ Cloud Edge TTS</span>
        </label>
        <label class="engine-option">
          <input type="radio" name="ttsEngine" value="browser">
          <span id="lblEngineBrowser">🔊 Browser Native</span>
        </label>
      </div>

      <div id="browserTtsSection">
        <div class="setting-row">
          <label id="lblSpeed">Speed</label>
          <div class="speed-row">
            <input type="range" id="ttsSpeed" min="0.3" max="3.0" step="0.1" value="1.0">
            <span id="ttsSpeedLabel" class="speed-value">1.0x</span>
          </div>
        </div>

        <div class="setting-row">
          <label id="lblVoice">Voice</label>
          <select id="ttsVoice">
            <option value="" id="optVoiceAuto">Auto Match (By page language)</option>
          </select>
        </div>
        <div class="test-row-popup">
          <button id="testBrowserVoiceBtn" class="btn-test-voice-sm">▶ Test Browser</button>
          <span id="testBrowserVoiceResult" class="test-result"></span>
        </div>
      </div>
    </div>

    <!-- 云端语音 -->
    <div class="section" id="cloudTtsSection">
      <div class="section-title" id="lblCloudTtsSection">Cloud TTS (Edge TTS)</div>
      <div class="setting-row">
        <label id="lblCloudEndpoint">Server Endpoint</label>
        <input type="text" id="cloudTtsEndpoint" placeholder="https://liang-studio.duckdns.org/edge-tts">
      </div>
      <div class="setting-row">
        <label id="lblCloudVoice">Cloud Voice</label>
        <select id="cloudTtsVoice">
          <option value="" id="optCloudAuto">⚡ Auto Select (Recommended)</option>
        </select>
      </div>
      <div class="test-row-popup">
        <button id="testCloudVoiceBtn" class="btn-test-voice-sm btn-cloud-sm">☁️ Test Cloud</button>
        <span id="testCloudVoiceResult" class="test-result"></span>
      </div>
    </div>

    <!-- AI 翻译与多语种摘要设置 -->
    <div class="section">
      <div class="section-title-wrap" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="section-title" id="lblAiSection" style="margin:0;">AI Provider &amp; Summary</div>
        <button class="btn-help-link" id="btnHelpAiPopup" type="button" style="background:none;border:none;color:#38bdf8;cursor:pointer;font-size:12px;text-decoration:underline;">❓ LLM Setup Guide &amp; Free API Keys</button>
      </div>

      <div class="setting-row">
        <label id="lblProvider">Provider Preset</label>
        <select id="aiProviderSelect">
          <option value="openai" id="optProviderOpenAI">OpenAI (ChatGPT)</option>
          <option value="deepseek" id="optProviderDeepSeek">DeepSeek</option>
          <option value="siliconflow" id="optProviderSiliconFlow">SiliconFlow</option>
          <option value="gemini" id="optProviderGemini">Google Gemini</option>
          <option value="moonshot" id="optProviderMoonshot">Moonshot (Kimi)</option>
          <option value="qwen" id="optProviderQwen">Aliyun Qwen</option>
          <option value="custom" id="optProviderCustom">Custom</option>
        </select>
      </div>

      <div class="setting-row">
        <label id="lblEndpoint">API Endpoint</label>
        <input type="text" id="aiEndpoint" placeholder="https://api.openai.com/v1">
      </div>
      <div class="setting-row">
        <label id="lblApiKey">API Key</label>
        <input type="password" id="aiApiKey" placeholder="sk-...">
      </div>
      <div class="setting-row">
        <label id="lblModel">Model</label>
        <input type="text" id="aiModel" list="aiModelList" placeholder="gpt-4o-mini">
        <datalist id="aiModelList">
          <option value="gpt-4o-mini" id="optModelGpt4oMini">gpt-4o-mini</option>
          <option value="gpt-4o">gpt-4o</option>
          <option value="deepseek-chat">deepseek-chat (DeepSeek V3)</option>
          <option value="deepseek-reasoner">deepseek-reasoner (DeepSeek R1)</option>
          <option value="Qwen/Qwen2.5-7B-Instruct" id="optModelSiliconFree">Qwen/Qwen2.5-7B-Instruct</option>
          <option value="gemini-2.0-flash">gemini-2.0-flash</option>
        </datalist>
      </div>
      <div class="setting-row">
        <label id="lblTargetLanguage">Target Language</label>
        <select id="translateTarget">
          <option value="Simplified Chinese" data-no-i18n="1">简体中文</option>
          <option value="English">English</option>
          <option value="Japanese" data-no-i18n="1">日本語</option>
          <option value="Korean">한국어</option>
          <option value="French">Français</option>
          <option value="German">Deutsch</option>
          <option value="Spanish">Español</option>
          <option value="Russian">Русский</option>
          <option value="Italian">Italiano</option>
          <option value="Portuguese">Português</option>
        </select>
      </div>
      <div class="setting-row">
        <label id="lblHighlight">Sentence Highlight</label>
        <input type="checkbox" id="highlightEnabled">
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
        <button id="testBtn" class="btn-test">Test AI Connection</button>
        <span id="testAiResult" class="test-result"></span>
      </div>
    </div>

    <div class="footer">
      <div style="display:flex;align-items:center;gap:6px;">
        <button id="saveBtn" class="btn-save">Save Settings</button>
        <span id="saveStatus" class="save-status"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="btnPopupDonate" class="btn-settings" style="color:#facc15;border-color:rgba(250,204,21,0.3);background:rgba(250,204,21,0.1);cursor:pointer;"></button>
        <button id="openOptionsBtn" class="btn-settings">⚙ Full Options</button>
      </div>
    </div>

    <!-- 快捷帮助弹层 -->
    <div id="popupHelpModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.96);z-index:9999;flex-direction:column;box-sizing:border-box;padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:10px;margin-bottom:12px;">
        <h4 id="popupHelpTitle" style="margin:0;color:#38bdf8;font-size:14px;"></h4>
        <button id="popupHelpClose" style="background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div id="popupHelpBody" style="flex:1;overflow-y:auto;font-size:12.5px;line-height:1.65;color:#cbd5e1;padding-right:4px;"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
