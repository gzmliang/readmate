<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ReadMate - Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <!-- 顶部常驻：精致下拉语言选择栏 -->
    <div class="lang-nav-bar">
      <div class="lang-nav-left">
        <span class="app-logo">📖 ReadMate</span>
      </div>
      <div class="lang-select-wrap">
        <span class="lang-globe-icon">🌐</span>
        <select id="uiLangSelect" class="lang-dropdown">
          <option value="zh_CN">🇨🇳 简体中文</option>
          <option value="en">🇺🇸 English</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="es">🇪🇸 Español</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="ru">🇷🇺 Русский</option>
        </select>
      </div>
    </div>

    <!-- 朗读语音流模式 -->
    <div class="section">
      <div class="section-title" id="lblSectionVoiceStream">朗读语音流模式</div>
      <div class="setting-row">
        <label id="lblVoiceMode">播放模式</label>
        <select id="readVoiceMode">
          <option value="original" id="optModeOriginal">🔊 仅读原文 (外语/原汁原味)</option>
          <option value="translated" id="optModeTranslated">🌐 直接读译文 (外文变母语广播)</option>
          <option value="bilingual" id="optModeBilingual">🔄 双语交替读 (句句对照/学外语)</option>
        </select>
      </div>
      <div class="setting-row">
        <label id="lblEnableBilingual">双语翻译</label>
        <label class="switch-label">
          <input type="checkbox" id="enableBilingual">
          <span id="lblChkEnableBilingual">启用 AI 双语翻译 (关闭时 0 Token 极速读原文)</span>
        </label>
      </div>
      <div class="setting-row">
        <label id="lblBilingualSubtitles">字幕显示</label>
        <label class="switch-label">
          <input type="checkbox" id="showBilingualSubtitles" checked>
          <span id="lblChkShowSubtitles">在控制条显示浮窗字幕</span>
        </label>
      </div>
    </div>

    <!-- 引擎设置 -->
    <div class="section">
      <div class="section-title-wrap" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div class="section-title" id="lblTtsSection" style="margin:0;">语音朗读引擎</div>
        <button class="btn-help-link" id="btnHelpTts" type="button" style="background:none;border:none;color:#38bdf8;cursor:pointer;font-size:12.5px;text-decoration:underline;"></button>
      </div>

      <div class="engine-switch" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
        <label class="engine-option">
          <input type="radio" name="ttsEngine" value="cloud" checked>
          <span id="lblEngineCloud">☁️ Edge TTS (推荐)</span>
        </label>
        <label class="engine-option">
          <input type="radio" name="ttsEngine" value="browser">
          <span id="lblEngineBrowser">🔊 浏览器原生</span>
        </label>
        <label class="engine-option">
          <input type="radio" name="ttsEngine" value="openai">
          <span id="lblEngineOpenAI">🎙️ 通用 AI 语音</span>
        </label>
      </div>

      <div class="setting-row">
        <label id="lblSpeed">语速</label>
        <div class="speed-row">
          <input type="range" id="ttsSpeed" min="0.3" max="3.0" step="0.1" value="1.0">
          <span id="ttsSpeedLabel" class="speed-value">1.0x</span>
        </div>
      </div>

      <!-- Edge TTS 云端配置 -->
      <div id="cloudTtsSection">
        <div class="setting-row">
          <label id="lblCloudEndpoint">服务器地址</label>
          <input type="text" id="cloudTtsEndpoint" placeholder="http://powerplus.blogsyte.com:5001">
        </div>
        <div class="setting-row">
          <label id="lblCloudVoice">云端音色</label>
          <select id="cloudTtsVoice">
            <option value="" id="optCloudAuto">⚡ 自动选择 (推荐)</option>
          </select>
        </div>
        <div class="setting-row">
          <label id="lblTransVoice">🌐 译文专用音色</label>
          <select id="cloudTtsVoiceTrans">
            <option value="" id="optTransVoiceAuto">跟随母语最佳音色 (中文自动用晓晓)</option>
          </select>
        </div>
        <div class="test-row">
          <button id="testCloudVoiceBtn" class="btn-test">☁️ 测试云端语音</button>
          <span id="testCloudVoiceResult" class="test-result"></span>
        </div>
      </div>

      <!-- 通用 OpenAI 兼容 AI 语音配置 -->
      <div id="openaiTtsSection" style="display:none;">
        <div class="setting-row">
          <label id="lblOpenAiEndpoint">TTS API 端点</label>
          <input type="text" id="openaiTtsEndpoint" placeholder="https://api.openai.com/v1">
        </div>
        <div class="setting-row">
          <label id="lblOpenAiKey">TTS API Key</label>
          <input type="password" id="openaiTtsApiKey" placeholder="sk-...">
        </div>
        <div class="setting-row">
          <label id="lblOpenAiModel">TTS 模型</label>
          <input type="text" id="openaiTtsModel" placeholder="tts-1">
        </div>
        <div class="setting-row">
          <label id="lblOpenAiVoice">TTS 音色 (Voice)</label>
          <input type="text" id="openaiTtsVoice" placeholder="alloy / echo / fable / onyx / nova / shimmer">
        </div>
        <div class="test-row">
          <button id="testOpenAiTtsBtn" class="btn-test">🎙️ 测试 AI 语音</button>
          <span id="testOpenAiTtsResult" class="test-result"></span>
        </div>
      </div>

      <!-- 本地配置 -->
      <div id="browserTtsSection" style="display:none;">
        <div class="setting-row">
          <label id="lblVoice">语音</label>
          <select id="ttsVoice">
            <option value="" id="optVoiceAuto">⚡ 自动选择 (推荐)</option>
          </select>
        </div>
        <div class="test-row">
          <button id="testBrowserVoiceBtn" class="btn-test">▶ 测试浏览器语音</button>
          <span id="testBrowserVoiceResult" class="test-result"></span>
        </div>
      </div>
    </div>

    <!-- AI 服务商与摘要设置 -->
    <div class="section">
      <div class="section-title-wrap" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div class="section-title" id="lblAiSection" style="margin:0;">AI 服务商与摘要</div>
        <button class="btn-help-link" id="btnHelpAi" type="button" style="background:none;border:none;color:#38bdf8;cursor:pointer;font-size:12.5px;text-decoration:underline;"></button>
      </div>

      <div class="setting-row">
        <label id="lblProvider">服务商预设</label>
        <select id="aiProviderSelect">
          <option value="openai" id="optProviderOpenAI">OpenAI (ChatGPT)</option>
          <option value="deepseek" id="optProviderDeepSeek">DeepSeek</option>
          <option value="siliconflow" id="optProviderSiliconFlow">SiliconFlow</option>
          <option value="gemini" id="optProviderGemini">Google Gemini</option>
          <option value="moonshot" id="optProviderMoonshot">Moonshot (Kimi)</option>
          <option value="qwen" id="optProviderQwen">Aliyun Qwen</option>
          <option value="custom" id="optProviderCustom">Custom</option>
        </select>
      </div>

      <div class="setting-row">
        <label id="lblEndpoint">API 端点</label>
        <input type="text" id="aiEndpoint" placeholder="https://api.openai.com/v1">
      </div>
      <div class="setting-row">
        <label id="lblApiKey">API Key</label>
        <input type="password" id="aiApiKey" placeholder="sk-...">
      </div>
      <div class="setting-row">
        <label id="lblModel">模型</label>
        <input type="text" id="aiModel" list="aiModelList" placeholder="gpt-4o-mini">
        <datalist id="aiModelList">
          <option value="gpt-4o-mini" id="optModelGpt4oMini">gpt-4o-mini</option>
          <option value="gpt-4o">gpt-4o</option>
          <option value="deepseek-chat">deepseek-chat (DeepSeek V3)</option>
          <option value="deepseek-reasoner">deepseek-reasoner (DeepSeek R1)</option>
          <option value="Qwen/Qwen2.5-7B-Instruct" id="optModelSiliconFree">Qwen/Qwen2.5-7B-Instruct</option>
          <option value="gemini-2.0-flash">gemini-2.0-flash</option>
        </datalist>
      </div>
      <div class="setting-row">
        <label id="lblTargetLanguage">目标翻译语言</label>
        <select id="translateTarget">
          <option value="Simplified Chinese">简体中文</option>
          <option value="English">English</option>
          <option value="Japanese">日本語</option>
          <option value="Korean">한국어</option>
          <option value="French">Français</option>
          <option value="German">Deutsch</option>
          <option value="Spanish">Español</option>
          <option value="Russian">Русский</option>
        </select>
      </div>
      <div class="setting-row">
        <label id="lblSummaryViewMode">默认摘要呈现</label>
        <select id="defaultSummaryView">
          <option value="bilingual" id="optSummaryBilingual">🔄 双语对照 (原文 + 译文)</option>
          <option value="original" id="optSummaryOriginal">📄 仅原文 (沉浸阅读/不看译文)</option>
          <option value="translated" id="optSummaryTranslated">🌐 仅译文 (母语快速浏览)</option>
        </select>
      </div>
      <div class="setting-row">
        <label id="lblHighlight">朗读高亮</label>
        <input type="checkbox" id="highlightEnabled">
      </div>
      <div class="setting-row">
        <label id="lblHighlightParagraph">段落上下文高亮</label>
        <input type="checkbox" id="highlightParagraphEnabled">
      </div>
      <div class="setting-row">
        <label id="lblShowFab">显示右下角悬浮球</label>
        <input type="checkbox" id="showFab">
      </div>

      <div class="test-row">
        <button id="testAiBtn" class="btn-test">测试 AI 连接</button>
        <span id="testAiResult" class="test-result"></span>
      </div>
    </div>

    <!-- 底部保存 -->
    <div class="footer" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="saveBtn" class="btn-save">保存设置</button>
        <span id="saveStatus" class="save-status"></span>
      </div>
      <button id="btnOptionsDonate" type="button" style="background:rgba(250,204,21,0.12);border:1px solid rgba(250,204,21,0.35);color:#facc15;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;">
      </button>
    </div>

    <!-- 弹窗：详细帮助与自建指南指南 -->
    <div id="helpModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.65);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(4px);">
      <div style="background:#1e293b;color:#f8fafc;width:720px;max-width:92vw;max-height:86vh;border-radius:16px;border:1px solid rgba(255,255,255,0.15);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,0.6);">
        <div style="padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:center;">
          <h3 id="helpModalTitle" style="margin:0;font-size:16px;color:#38bdf8;">📖 ReadMate 帮助与配置指南</h3>
          <button id="helpModalClose" style="background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer;">✕</button>
        </div>
        <div id="helpModalContent" style="padding:20px;overflow-y:auto;font-size:13.5px;line-height:1.7;color:#cbd5e1;"></div>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
